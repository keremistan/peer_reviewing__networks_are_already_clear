# Configuration for Modern InceptionV1 - Large Scale (300x Scale, ~28M params)
model:
  scale: large
  width_multiplier: 1.66
  num_classes: 100
  use_residual: true
  residual_scale: 1.0
  drop_path_rate: 0.15
  dropout_rate: 0.3

training:
  epochs: 100
  warmup_epochs: 5
  batch_size: 64
  lr: 0.0005
  min_lr: 0.000001
  weight_decay: 0.05
  clip_grad: 1.0
  use_amp: true

data:
  img_size: 224
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mixup_prob: 1.0
  label_smoothing: 0.1
